name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sikkha-nogori/package-lock.json

      - name: Install dependencies
        run: |
          test -f "$GITHUB_WORKSPACE/sikkha-nogori/package.json"
          test -f "$GITHUB_WORKSPACE/sikkha-nogori/package-lock.json"
          npm ci --prefix "$GITHUB_WORKSPACE/sikkha-nogori" --package-lock=true

      - name: Run ESLint
        run: npm run lint --prefix "$GITHUB_WORKSPACE/sikkha-nogori"

      - name: Generate Next.js types
        run: cd "$GITHUB_WORKSPACE/sikkha-nogori" && npx next typegen

      - name: Type-check
        run: cd "$GITHUB_WORKSPACE/sikkha-nogori" && npx tsc --noEmit

      - name: Run tests
        run: npm test --prefix "$GITHUB_WORKSPACE/sikkha-nogori"

      - name: Build production app
        run: npm run build --prefix "$GITHUB_WORKSPACE/sikkha-nogori"
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CONTACT_EMAIL: ci@example.com
