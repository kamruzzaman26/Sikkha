name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sikkha-nogori/package-lock.json

      - name: Install dependencies
        run: cd sikkha-nogori && npm ci

      - name: Run ESLint
        run: cd sikkha-nogori && npm run lint

      - name: Generate Next.js types
        run: cd sikkha-nogori && npx next typegen

      - name: Type-check
        run: cd sikkha-nogori && npx tsc --noEmit

      - name: Run tests
        run: cd sikkha-nogori && npm test

      - name: Build production app
        run: cd sikkha-nogori && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CONTACT_EMAIL: ci@example.com
